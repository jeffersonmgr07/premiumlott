<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login · PremiumLott</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/main.css"></head><body><div class="page-wrapper">
<div class="demo-banner" data-demo-banner></div>
<header data-site-header></header>
<main class="main"><section class="auth-shell"><article class="card auth-card">
  <p class="eyebrow">Acceso cliente</p><h1>Inicia sesión</h1><p class="muted">Ingresa para consultar tus jugadas, saldo y premios disponibles.</p>
  <form class="form" data-login-form novalidate>
    <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required placeholder="cliente@email.com"><span class="field-error" data-error-for="email"></span></div>
    <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required placeholder="••••••••"><span class="field-error" data-error-for="password"></span></div>
    <button class="btn btn-primary" type="submit" data-submit-btn>Ingresar</button>
    <button class="btn btn-outline" type="button" data-google-btn>Continuar con Google</button>
    <p class="mini"><a href="recuperar-password.html">¿Olvidaste tu contraseña?</a></p>
    <p class="mini">¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
  </form>
  <div class="card compact notice" style="margin-top:1rem"><strong>Acceso de demostración administrativo</strong><p class="mini">admin@premiumlott.demo · PremiumDemo2026!</p></div>
</article></section></main>
<footer data-site-footer></footer>
</div>
