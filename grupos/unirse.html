<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Unirme a un grupo · PremiumLott</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="page-wrapper">
<div class="demo-banner" data-demo-banner></div>
<header data-site-header></header>
<main class="main"><section class="auth-shell"><article class="card auth-card">
  <p class="eyebrow">Unirme</p><h1>Ingresa con un código</h1><p class="muted">Pídele a tu grupo el código de invitación de 6 caracteres o abre el enlace que te compartieron.</p>
  <form class="form" data-join-form novalidate>
    <div class="field"><label for="code">Código de invitación</label><input id="code" name="code" maxlength="6" style="text-transform:uppercase;letter-spacing:.2em;text-align:center;font-weight:800" required><span class="field-error" data-error-for="code"></span></div>
    <button class="btn btn-primary" type="submit" data-submit-btn>Buscar grupo</button>
  </form>
  <div class="card compact" data-preview hidden style="margin-top:1rem">
    <div class="group-card-head"><div class="group-avatar" data-preview-avatar></div><div><h3 data-preview-name></h3><p class="muted" data-preview-desc></p></div></div>
    <div class="metric"><span>Miembros</span><strong data-preview-members></strong></div>
    <div class="metric"><span>Modalidad</span><strong data-preview-mode></strong></div>
    <button class="btn btn-primary" style="margin-top:.8rem;width:100%" data-confirm-join>Unirme a este grupo</button>
  </div>
</article></section></main>
<footer data-site-footer></footer>
</div>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/settlement.js"></script>

</body></html>
