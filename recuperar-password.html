<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Recuperar contraseña · PremiumLott</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/main.css"></head><body><div class="page-wrapper">
<div class="demo-banner" data-demo-banner></div>
<header data-site-header></header>
<main class="main"><section class="auth-shell"><article class="card auth-card">
  <p class="eyebrow">Recuperación</p><h1>Recupera tu acceso</h1><p class="muted">Ingresa tu correo para generar un código de prueba y restablecer tu contraseña.</p>

  <form class="form" data-request-form novalidate>
    <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" required></div>
    <button class="btn btn-primary" type="submit">Generar código de prueba</button>
  </form>

  <div class="card compact notice" data-demo-code-box hidden style="margin-top:1rem"><strong>Código de prueba (solo demo)</strong><div class="otp-demo-code" data-demo-code></div></div>

  <form class="form" data-reset-form hidden novalidate>
    <div class="field"><label for="code">Código recibido</label><input id="code" name="code" inputmode="numeric" maxlength="6" required><span class="field-error" data-error-for="code"></span></div>
    <div class="field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" name="newPassword" type="password" required><span class="field-error" data-error-for="newPassword"></span></div>
    <div class="field"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" name="confirmPassword" type="password" required><span class="field-error" data-error-for="confirmPassword"></span></div>
    <button class="btn btn-primary" type="submit" data-submit-btn>Restablecer contraseña</button>
  </form>
  <p class="mini"><a href="login.html">Volver a iniciar sesión</a></p>
</article></section></main>
<footer data-site-footer></footer>
</div>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/settlement.js"></script>
<script src="assets/js/core/formatters.js"></script>

<script src="assets/js/services/mock-api.js"></script>
<script src="assets/js/services/api-client.js"></script>
<script src="assets/js/services/auth-service.js"></script>
<script src="assets/js/services/wallet-service.js"></script>
<script src="assets/js/services/group-service.js"></script>
<script src="assets/js/services/premiumgol-service.js"></script>
<script src="assets/js/services/admin-service.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/pages/reset-password.js"></script>
</body></html>
