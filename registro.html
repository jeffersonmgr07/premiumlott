<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registro · PremiumLott</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/main.css"></head><body><div class="page-wrapper">
<div class="demo-banner" data-demo-banner></div>
<header data-site-header></header>
<main class="main"><section class="auth-shell"><article class="card auth-card" style="width:min(100%,640px)">
  <p class="eyebrow">Nueva cuenta</p><h1>Regístrate</h1><p class="muted">Crea tu cuenta demo para participar, guardar jugadas y consultar premios ficticios.</p>
  <form class="form" data-register-form novalidate>
    <div class="grid grid-2">
      <div class="field"><label for="firstName">Nombres</label><input id="firstName" name="firstName" required><span class="field-error" data-error-for="firstName"></span></div>
      <div class="field"><label for="lastName">Apellidos</label><input id="lastName" name="lastName" required><span class="field-error" data-error-for="lastName"></span></div>
    </div>
    <div class="grid grid-2">
      <div class="field"><label for="dni">DNI (8 dígitos)</label><input id="dni" name="dni" inputmode="numeric" maxlength="8" required><span class="field-error" data-error-for="dni"></span></div>
      <div class="field"><label for="phone">Celular peruano</label><input id="phone" name="phone" placeholder="9XXXXXXXX" inputmode="numeric" required><span class="field-error" data-error-for="phone"></span></div>
    </div>
    <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" required><span class="field-error" data-error-for="email"></span></div>
    <div class="grid grid-2">
      <div class="field"><label>País</label><input value="Perú" disabled></div>
      <div class="field"><label for="birthDate">Fecha de nacimiento</label><input id="birthDate" name="birthDate" type="date" required><span class="field-error" data-error-for="birthDate"></span></div>
    </div>
    <div class="grid grid-2">
      <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required><span class="field-error" data-error-for="password"></span></div>
      <div class="field"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" name="confirmPassword" type="password" required><span class="field-error" data-error-for="confirmPassword"></span></div>
    </div>
    <p class="mini">Mínimo 8 caracteres, con al menos una letra y un número.</p>
    <label class="mini"><input type="checkbox" name="termsAccepted" required> Acepto los <a href="pages/legales/terminos-condiciones.html" target="_blank">términos y condiciones</a>.</label>
    <label class="mini"><input type="checkbox" name="privacyAccepted" required> Acepto la <a href="pages/legales/politica-privacidad.html" target="_blank">política de privacidad</a>.</label>
    <label class="mini"><input type="checkbox" name="ageDeclared" required> Declaro que soy mayor de 18 años.</label>
    <label class="mini"><input type="checkbox" name="marketingConsent"> Deseo recibir comunicaciones promocionales (opcional).</label>
    <button class="btn btn-primary" type="submit" data-submit-btn>Crear cuenta</button>
  </form>
</article></section></main>
<footer data-site-footer></footer>
</div>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/settlement.js"></script>
<script src="assets/js/core/formatters.js"></script>
<script src="assets/js/core/router-utils.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/core/layout.js"></script>
<script src="assets/js/services/mock-api.js"></script>
<script src="assets/js/services/api-client.js"></script>
<script src="assets/js/services/auth-service.js"></script>
<script src="assets/js/services/wallet-service.js"></script>
<script src="assets/js/services/group-service.js"></script>
<script src="assets/js/services/premiumgol-service.js"></script>
<script src="assets/js/services/admin-service.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/pages/register.js"></script>
</body></html>
