<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Programas · Admin PremiumLott</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="page-wrapper">
<div class="demo-banner" data-demo-banner></div>
<header data-site-header></header>
<main class="main"><section class="section">
<div class="section-head"><div><p class="eyebrow">Administración</p><h1 class="title">Gestión de programas</h1></div></div>
<div class="admin-shell">
<nav class="admin-nav"><a href="index.html">Resumen</a><a href="programas.html" class="active">PremiumGol</a><a href="resultados.html">Resultados Gol</a><a href="liquidacion.html">Liquidación Gol</a><a href="premiumball.html">PremiumBall</a></nav>
<div>
  <article class="card" data-status-card hidden>
    <div class="section-head"><div><p class="eyebrow" data-program-code></p><h2 data-program-name></h2></div><span class="status" data-program-status></span></div>
    <div class="cart-line-actions">
      <button class="btn btn-primary" type="button" data-open-btn hidden>Abrir programa</button>
      <button class="btn btn-outline" type="button" data-close-btn hidden>Cerrar programa</button>
      <a class="btn btn-outline" data-results-link hidden href="resultados.html">Cargar resultados</a>
      <a class="btn btn-outline" data-settlement-link hidden href="liquidacion.html">Ir a liquidación</a>
      <button class="btn btn-ghost" type="button" data-cancel-btn hidden>Cancelar programa</button>
    </div>
  </article>

  <article class="card" style="margin-top:1rem">
    <h3 data-form-title>Nuevo programa</h3>
    <form class="form" data-program-form novalidate>
      <div class="field"><label for="name">Nombre del programa</label><input id="name" name="name" required></div>
      <div class="grid grid-2">
        <div class="field"><label for="openAt">Apertura</label><input id="openAt" name="openAt" type="datetime-local" required></div>
        <div class="field"><label for="closeAt">Cierre</label><input id="closeAt" name="closeAt" type="datetime-local" required></div>
      </div>
      <div class="field"><label for="voidPolicy">Política de partidos anulados</label>
        <select id="voidPolicy" name="voidPolicy"><option value="VOID_COUNTS_AS_HIT">Anulado cuenta como acierto (predeterminado)</option><option value="VOID_EXCLUDED">Anulado no cuenta como acierto</option></select>
      </div>
      <div class="grid grid-2">
        <div class="field"><label for="prizeMode">Modalidad de premiación</label>
          <select id="prizeMode" name="prizeMode">
            <option value="HIGHEST_SCORE">Mayor cantidad de aciertos</option>
            <option value="PERFECT_12">12 aciertos o pozo acumulado</option>
            <option value="MIXED">Mixta (semanal + acumulado)</option>
          </select>
        </div>
        <div class="field"><label for="prizePoolCents">Pozo (US$)</label><input id="prizePoolCents" name="prizePoolDollars" type="number" min="1" step="1" value="1000" required></div>
      </div>
      <p class="mini muted" data-carry-hint></p>
      <h4 style="margin-top:.6rem">Partidos (exactamente 12)</h4>
      <div data-matches-form></div>
      <button class="btn btn-primary" type="submit" data-submit-btn>Guardar programa</button>
    </form>
  </article>
</div>
</div>
</section></main>
<footer data-site-footer></footer>
</div>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/settlement.js"></script>
<script src="../assets/js/core/formatters.js"></script>
<script src="../assets/js/core/router-utils.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/layout.js"></script>
<script src="../assets/js/services/mock-api.js"></script>
<script src="../assets/js/services/api-client.js"></script>
<script src="../assets/js/services/auth-service.js"></script>
<script src="../assets/js/services/wallet-service.js"></script>

<script src="../assets/js/services/premiumgol-service.js"></script>
<script src="../assets/js/services/admin-service.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/pages/admin-programs.js"></script>
</body></html>
